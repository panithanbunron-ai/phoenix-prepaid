name: Auto PR

on:
  push:
    branches:
      - feature/auto-pr

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR to main (if none exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" --title "$BRANCH" --fill \
              || echo "No changes to open a PR for (branch has no diff against main). Skipping."
          else
            echo "PR #$PR_NUMBER already open for $BRANCH"
          fi
