name: Auto PR

on:
    push:
        branches-ignore:
            - feature/auto-pr
            - main
            - master

permissions:
    contents: read
    pull-requests: write

jobs:
    open-pr:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Open PR to feature/auto-pr (if none exists)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  BRANCH="${GITHUB_REF#refs/heads/}"
                  BASE="feature/auto-pr"
                  TITLE="$(git log -1 --pretty=%s)"
                  PATTERN='^(feat|fix|chore|test|docs|refactor|style|perf|ci)(\([a-zA-Z0-9_-]+\))?: .+'

                  if ! echo "$TITLE" | grep -qE "$PATTERN"; then
                    echo "::error::Commit message ไม่ตรงตาม Conventional Commits: \"$TITLE\""
                    echo "รูปแบบที่ถูกต้อง: <type>(<scope>): <subject> เช่น 'feat(auth): add OTP verification'"
                    echo "ดู doc/commit-convention.md สำหรับรายละเอียด — จะไม่สร้าง PR ให้จนกว่าจะแก้ commit message"
                    exit 1
                  fi

                  PR_NUMBER=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')

                  if [ -z "$PR_NUMBER" ]; then
                    gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --fill \
                      || echo "No changes to open a PR for (branch has no diff against $BASE). Skipping."
                  else
                    echo "PR #$PR_NUMBER already open for $BRANCH"
                  fi
